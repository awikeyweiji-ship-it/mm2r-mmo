name: Build standalone Clash GPT assistant APK

on:
  push:
    branches:
      - feature/clash-gpt-dual-installer-r3-20261013
    paths:
      - .github/workflows/clash-gpt-apk-build.yml
      - build-assets/GPT_Starter_R3_source.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified existing Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode build-assets/GPT_Starter_R3_source.tar.gz.b64 > /tmp/clash-gpt-sources.tar.gz
          echo '638191c93703230ae0e8dd9121c3ba2d32ee1b79721de6174c4fdeb1be39cdd0  /tmp/clash-gpt-sources.tar.gz' | sha256sum -c -
          mkdir -p /tmp/clash-gpt-build
          tar -xzf /tmp/clash-gpt-sources.tar.gz -C /tmp/clash-gpt-build
          mkdir -p /tmp/clash-gpt-build/app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/MetaCubeX/ClashMetaForAndroid/releases/download/v2.11.30/cmfa-2.11.30-meta-arm64-v8a-release.apk' \
            -o /tmp/clash-gpt-build/app/src/main/assets/clash-meta.apk
          echo '93a719347dc2318b6b6356c588646a7ee82fd7ab0355e7a865fe6954de1234f0  /tmp/clash-gpt-build/app/src/main/assets/clash-meta.apk' | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/android-commandlinetools.zip" -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          # sdkmanager may close its input after accepting licenses, causing yes to
          # exit with SIGPIPE; only the sdkmanager result should govern success.
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platforms;android-35' 'build-tools;35.0.0'
          set -o pipefail
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and build APK
        working-directory: /tmp/clash-gpt-build
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_core_tests.sh
          python3 tests/test_contract.py
          python3 tests/test_ui_contract.py
          python3 tests/test_dual_install_contract.py
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          unzip -p "$APK" assets/clash-meta.apk | sha256sum
          test "$(unzip -p "$APK" assets/clash-meta.apk | sha256sum | cut -d ' ' -f 1)" = '93a719347dc2318b6b6356c588646a7ee82fd7ab0355e7a865fe6954de1234f0'
          sha256sum "$APK"

      - name: Publish APK on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp /tmp/clash-gpt-build/app/build/outputs/apk/debug/app-debug.apk releases/GPT_Clash_Dual_Installer_R3_20261013.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/GPT_Clash_Dual_Installer_R3_20261013.apk
          git commit -m 'build: deliver guarded dual-app installer R3 [skip ci]'
          git push origin HEAD:feature/clash-gpt-dual-installer-r3-20261013

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clash-gpt-starter-installable-apk
          path: /tmp/clash-gpt-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30
