name: R8 inspect and materialize Android source

on:
  push:
    branches:
      - feature/android-agent-integrated-r8-20261016
    paths:
      - .github/workflows/r8-materialize-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode archive and create safe manifest
        shell: bash
        run: |
          set -euo pipefail
          base64 -d build-assets/r7b_hardening_sources.base64.txt > "$RUNNER_TEMP/r7b.tar.gz"
          echo "ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/r7b.tar.gz" | cut -d' ' -f1)"
          tar -tzf "$RUNNER_TEMP/r7b.tar.gz" > "$RUNNER_TEMP/tree.txt"
          {
            echo "# R7B source archive tree"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/tree.txt"
            echo '```'
          } > docs/r8-source-manifest.md
      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/r8-source-manifest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: inspect R7B Android source archive"
          git push origin HEAD:feature/android-agent-integrated-r8-20261016