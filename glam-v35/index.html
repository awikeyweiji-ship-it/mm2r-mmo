function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}function init(){prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));const P=[],N=[],U=[],I=[],lat=72,lon=96;for(let y=0;y<=lat;y++){const t=y/lat*Math.PI;for(let x=0;x<=lon;x++){const ph=x/lon*TAU,st=Math.sin(t),ct=Math.cos(t),sp=Math.sin(ph),cp=Math.cos(ph);let px=.72*st*cp,py=1.02*ct,pz=.84*st*sp;const front=Math.max(0,sp);px*=1-.08*front*Math.max(0,(py+.45));pz+=.10*front*Math.exp(-Math.pow(py*.9,2));P.push(px,py,pz);N.push(st*cp,ct,st*sp);U.push(x/lon,y/lat)}}for(let y=0;y<lat;y++)for(let x=0;x<lon;x++){const a=y*(lon+1)+x,b=a+1,c=a+lon+1,d=c+1;I.push(a,c,b,b,c,d)}const idx=new Uint32Array(I),verts=new Float32Array(P.length+N.length+U.length);vao=gl.createVertexArray();gl.bindVertexArray(vao);function buf(loc,data,size){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0)}buf(0,P,3);buf(1,N,3);buf(2,U,2);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);count=idx.length;tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);resize()}

const makeup=(()=>{const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;const c=canvas.getContext('2d',{willReadFrequently:true});c.lineCap='round';c.lineJoin='round';function clear(){c.clearRect(0,0,512,512);actor?.render?.()}function pt(u,v){return[u*512,v*512]}function draw(u,v,color,size,alpha,mode='paint'){const[x,y]=pt(u,v);c.save();c.globalAlpha=alpha;c.globalCompositeOperation=mode==='erase'?'destination-out':'source-over';if(mode==='glitter'){for(let i=0;i<4;i++){const a=Math.random()*TAU,r=Math.random()*size;c.fillStyle=i%2?'#ffffff':color;c.beginPath();c.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,Math.random()*2.5+1,0,TAU);c.fill()}}else{const g=c.createRadialGradient(x,y,0,x,y,size);g.addColorStop(0,color);g.addColorStop(.55,color);g.addColorStop(1,color+'00');c.fillStyle=g;c.beginPath();c.arc(x,y,size,0,TAU);c.fill()}c.restore();actor.render()}return{canvas,c,clear,draw}})();
const REGION={lidL:{c:[.38,.46],r:[.10,.055]},lidR:{c:[.62,.46],r:[.10,.055]},cheekL:{c:[.34,.57],r:[.13,.11]},cheekR:{c:[.66,.57],r:[.13,.11]},lips:{c:[.5,.685],r:[.105,.052]},browL:{c:[.38,.395],r:[.11,.035]},browR:{c:[.62,.395],r:[.11,.035]},nose:{c:[.5,.57],r:[.07,.11]},jaw:{c:[.5,.77],r:[.25,.12]},skin:{c:[.5,.54],r:[.34,.38]},eyeL:{c:[.38,.46],r:[.10,.04]},eyeR:{c:[.62,.46],r:[.10,.04]},lashL:{c:[.38,.455],r:[.10,.04]},lashR:{c:[.62,.455],r:[.10,.04]}};
function inside(uv,id,scale=1){const q=REGION[id];if(!q)return false;const dx=(uv.u-q.c[0])/(q.r[0]*scale),dy=(uv.v-q.c[1])/(q.r[1]*scale);return dx*dx+dy*dy<=1}function nearestRegion(uv,ids){let best=null,bd=9;for(const id of ids){const q=REGION[id]||REGION[id.replace('lash','eye')];if(!q)continue;const dx=(uv.u-q.c[0])/q.r[0],dy=(uv.v-q.c[1])/q.r[1],d=dx*dx+dy*dy;if(d<bd){bd=d;best=id}}return{region:best,d:Math.sqrt(bd)}}

function metricRegion(id){if(id==='skin'||id==='nose'||id==='jaw')return'skin';if(/eye|lid|lash/.test(id))return'eyes';if(/lip/.test(id))return'lips';if(/cheek/.test(id))return'cheeks';if(/brow/.test(id))return'brows';return'skin'}
function deposit(g,p,color,velocity=0){if(!g)return false;const id=g.region,m=metricRegion(id),valid=p.regions.includes('skin')||p.regions.includes(id)||p.regions.some(r=>metricRegion(r)===m);if(!valid){world.accidents++;world.hype+=(p.mutators||[]).includes('oopsToHype')?3.5:.7;return false}const actions=[{u:g.target.u,v:g.target.v,a:1}],mods=p.mutators||[];if(mods.includes('mirror'))actions.push({u:1-g.target.u,v:g.target.v,a:.86});if(mods.includes('copy'))actions.push({u:g.target.u+.014,v:g.target.v+.009,a:.58});if(mods.includes('fork'))actions.push({u:g.target.u-.018,v:g.target.v-.012,a:.52},{u:g.target.u+.018,v:g.target.v+.012,a:.52});if(mods.includes('rebound')&&velocity>500)actions.push({u:g.target.u-.02,v:g.target.v+.025,a:.48});const size=p.kind==='粉底'?28:p.kind==='腮红'||p.kind==='修容'?24:p.kind==='眼影'?18:p.kind==='唇妆'?13:p.mode==='rail'?6:p.kind==='特效'?11:14,alpha=clamp(p.power*3.2,.18,.58);for(const a of actions){let col=mods.includes('afterColor')&&world.lastColor?world.lastColor:color;const drawMode=p.id==='eraser'?'erase':p.id==='glitter'||p.id.startsWith('sticker')?'glitter':'paint';makeup.draw(clamp(a.u),clamp(a.v),col,size,alpha*a.a,drawMode)}if(mods.includes('secondCoat'))setTimeout(()=>makeup.draw(g.target.u,g.target.v,color,size,alpha*.45),120);if(mods.includes('delayBurst'))setTimeout(()=>{makeup.draw(g.target.u,g.target.v,color,size*1.3,alpha*.55);burst('延迟爆发！')},320);world.lastColor=color;world.regionHits[id]=(world.regionHits[id]||0)+p.power;world.metrics[m]=clamp(world.metrics[m]+p.power*(g.locked?1.18:.82));if(p.id==='glitter'||p.id.startsWith('sticker'))world.metrics.glitter=clamp(world.metrics.glitter+p.power);if(p.id==='lipgloss'||p.finish.includes('水光')||p.finish.includes('珠光'))world.metrics.gloss=clamp(world.metrics.gloss+p.power);if(p.id==='lipmetal')world.metrics.metal=clamp(world.metrics.metal+p.power);if(p.id==='spray'||mods.includes('freeze'))world.metrics.lock=clamp(world.metrics.lock+p.power);if(p.id==='uv'||mods.includes('uvReson
